<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#1a2b4a"/>
    </linearGradient>
    <linearGradient id="po" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eefc"/>
      <stop offset="1" stop-color="#9db9f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7c4de0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- 底纹：细网格，呼应"看板" -->
  <g stroke="#223354" stroke-width="1" opacity="0.5">
    <path d="M 0 80 H 1280 M 0 160 H 1280 M 0 240 H 1280"/>
    <path d="M 160 0 V 320 M 320 0 V 320 M 480 0 V 320 M 640 0 V 320 M 800 0 V 320 M 960 0 V 320 M 1120 0 V 320"/>
  </g>

  <!-- 终端提示符 >_ ：终端基因 -->
  <g>
    <path d="M 74 96 L 148 152 L 74 208" fill="none" stroke="#4c8dff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="170" y="192" width="88" height="20" rx="6" fill="#7c4de0"/>
  </g>

  <!-- 主字 PO：粗斜体，Project Orchestrator 缩写 -->
  <text x="278" y="228" font-size="168" font-weight="800" font-style="italic" fill="url(#po)" letter-spacing="-6">PO</text>

  <!-- 六角色编队标记：2×3 网格 = 6 单责角色，颜色对应拓扑 -->
  <g transform="translate(520,96)">
    <rect x="0"   y="0" width="34" height="34" rx="8" fill="#4c8dff"/>
    <rect x="44"  y="0" width="34" height="34" rx="8" fill="#9b6ef3"/>
    <rect x="0"   y="44" width="34" height="34" rx="8" fill="#2fb380"/>
    <rect x="44"  y="44" width="34" height="34" rx="8" fill="#e6a23c"/>
    <rect x="0"   y="88" width="34" height="34" rx="8" fill="#c0392b"/>
    <rect x="44"  y="88" width="34" height="34" rx="8" fill="#16a085"/>
    <!-- 主 Agent 包裹框：一层编排，框住但不碰 -->
    <rect x="-12" y="-12" width="112" height="146" rx="14" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 7"/>
  </g>

  <!-- 名称与 tagline -->
  <text x="712" y="138" font-size="50" font-weight="800" fill="#f2f6ff" letter-spacing="-1">Project Orchestrator</text>
  <text x="714" y="184" font-size="25" fill="#8fa8d8">多 Agent 协作开发框架</text>
  <text x="714" y="228" font-size="19" fill="#5f7bab">单写手 · 只读参谋 · 门禁不放水 · 看板全程可观察</text>

  <!-- 底部色带：六角色色 = 框架的"签名" -->
  <g>
    <rect x="0" y="308" width="213" height="12" fill="#4c8dff"/>
    <rect x="213" y="308" width="213" height="12" fill="#9b6ef3"/>
    <rect x="426" y="308" width="213" height="12" fill="#2fb380"/>
    <rect x="639" y="308" width="213" height="12" fill="#e6a23c"/>
    <rect x="852" y="308" width="214" height="12" fill="#c0392b"/>
    <rect x="1066" y="308" width="214" height="12" fill="#16a085"/>
  </g>
</svg>
