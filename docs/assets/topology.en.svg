<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fdb"/><stop offset="1" stop-color="#5a8df0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a2b4a" flood-opacity="0.13"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8fa3c0"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="960" height="790" fill="url(#bg)" rx="14"/>
  <text x="480" y="40" font-size="17.6" font-weight="700" fill="#1f2328" text-anchor="middle">Project Orchestrator · Multi-Agent Collaboration Topology</text>
  <text x="480" y="61" font-size="10.1" fill="#778ba3" text-anchor="middle">Single-writer · single-layer orchestration · read-only advisors · gates never watered down</text>

  <!-- 用户 -->
  <rect x="405" y="78" width="150" height="34" rx="17" fill="#ffffff" stroke="#d0d7de" filter="url(#sh)"/>
  <text x="480" y="100" font-size="11.3" font-weight="600" fill="#1f2328" text-anchor="middle">👤 User</text>
  <line x1="480" y1="112" x2="480" y2="130" stroke="#8fa3c0" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="494" y="126" font-size="8.8" fill="#778ba3">Interrupted only in 4 cases</text>

  <!-- 主 Agent -->
  <rect x="260" y="134" width="440" height="58" rx="14" fill="url(#hero)" filter="url(#sh)"/>
  <text x="480" y="158" font-size="13.4" font-weight="700" fill="#ffffff" text-anchor="middle">🧭 Orchestrator · Project Owner</text>
  <text x="480" y="178" font-size="10.1" fill="#dce7fb" text-anchor="middle">Dispatch · accept · gate · triage — never does the work</text>

  <!-- 派发总线：主干 → 横轨 → 两落 -->
  <line x1="480" y1="192" x2="480" y2="206" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="290" y1="206" x2="670" y2="206" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="290" y1="206" x2="290" y2="230" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="670" y1="206" x2="670" y2="230" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="494" y="203" font-size="8.8" fill="#778ba3">Dispatch (only needed files)</text>

  <!-- 阶段徽标列 -->
  <g font-size="8.8" fill="#57606a" text-anchor="middle">
    <rect x="34" y="273" width="72" height="22" rx="11" fill="#eef2f8" stroke="#d0d7de"/><text x="70" y="288">S1·S2 Planning</text>
    <rect x="34" y="413" width="72" height="22" rx="11" fill="#eef2f8" stroke="#d0d7de"/><text x="70" y="428">S3 Parallel</text>
    <rect x="34" y="558" width="72" height="22" rx="11" fill="#eef2f8" stroke="#d0d7de"/><text x="70" y="573">S4·S5 Close-out</text>
  </g>

  <!-- ============ 第一层：PM × 架构师 ============ -->
  <g filter="url(#sh)">
    <rect x="120" y="236" width="340" height="96" rx="12" fill="#ffffff"/>
    <rect x="120" y="236" width="6" height="96" rx="3" fill="#4c8dff"/>
    <circle cx="156" cy="266" r="16" fill="#e7f0ff"/><text x="156" y="271" font-size="12.6" text-anchor="middle">📋</text>
    <text x="184" y="264" font-size="12.2" font-weight="700" fill="#1f2328">Product Manager · S1 reqs · S6 acceptance</text>
    <text x="184" y="282" font-size="9.7" fill="#778ba3">4-part reqs · PRD · 4 UI states · acceptance criteria</text>
    <rect x="184" y="294" width="58" height="20" rx="10" fill="#f0f6ff"/><text x="213" y="308" font-size="8.8" fill="#2f6fdb" text-anchor="middle">02-prd</text>
    <rect x="250" y="294" width="84" height="20" rx="10" fill="#f0f6ff"/><text x="292" y="308" font-size="8.8" fill="#2f6fdb" text-anchor="middle">03-ui-design</text>
    <rect x="342" y="294" width="100" height="20" rx="10" fill="#f0f6ff"/><text x="392" y="308" font-size="8.8" fill="#2f6fdb" text-anchor="middle">19-acceptance</text>

    <rect x="500" y="236" width="340" height="96" rx="12" fill="#ffffff"/>
    <rect x="500" y="236" width="6" height="96" rx="3" fill="#9b6ef3"/>
    <circle cx="536" cy="266" r="16" fill="#f3ecff"/><text x="536" y="271" font-size="12.6" text-anchor="middle">🏗️</text>
    <text x="564" y="264" font-size="12.2" font-weight="700" fill="#1f2328">Architect · S2 architecture</text>
    <text x="564" y="282" font-size="9.7" fill="#778ba3">System / front / back architecture · API contract</text>
    <rect x="564" y="294" width="180" height="20" rx="10" fill="#f6f0ff"/><text x="654" y="308" font-size="8.8" fill="#7c4de0" text-anchor="middle">09-api-contract · the only law</text>
    <rect x="752" y="294" width="80" height="20" rx="10" fill="#f6f0ff"/><text x="792" y="308" font-size="8.8" fill="#7c4de0" text-anchor="middle">05–08 architecture</text>
  </g>

  <!-- 会签桥 -->
  <path d="M 460 252 C 472 238 488 238 500 252" fill="none" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="440" y="212" width="80" height="18" rx="9" fill="#fdf6e3" stroke="#c9a227"/>
  <text x="480" y="225" font-size="8.4" fill="#a3861c" text-anchor="middle">Co-sign &amp; challenge</text>

  <!-- 交接轨 1：规划 → 开发 -->
  <line x1="290" y1="332" x2="290" y2="352" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="670" y1="332" x2="670" y2="352" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="290" y1="352" x2="670" y2="352" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="290" y1="352" x2="290" y2="370" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="670" y1="352" x2="670" y2="370" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="480" y="348" font-size="8.8" fill="#778ba3" text-anchor="middle">Artifacts as handoff · the 09 contract binds both ends</text>

  <!-- ============ 第二层：前端 × 后端 ============ -->
  <g filter="url(#sh)">
    <rect x="120" y="376" width="340" height="96" rx="12" fill="#ffffff"/>
    <rect x="120" y="376" width="6" height="96" rx="3" fill="#2fb380"/>
    <circle cx="156" cy="406" r="16" fill="#e8f7f0"/><text x="156" y="411" font-size="12.6" text-anchor="middle">💻</text>
    <text x="184" y="404" font-size="12.2" font-weight="700" fill="#1f2328">Frontend Dev · S3</text>
    <text x="184" y="422" font-size="9.7" fill="#778ba3">Pages &amp; interaction · all 4 UI states</text>
    <rect x="184" y="434" width="84" height="20" rx="10" fill="#e8f7f0"/><text x="226" y="448" font-size="8.8" fill="#1f8a5f" text-anchor="middle">11-frontend</text>
    <rect x="276" y="434" width="92" height="20" rx="10" fill="#e8f7f0"/><text x="322" y="448" font-size="8.8" fill="#1f8a5f" text-anchor="middle">12-iface-req</text>

    <rect x="500" y="376" width="340" height="96" rx="12" fill="#ffffff"/>
    <rect x="500" y="376" width="6" height="96" rx="3" fill="#e6a23c"/>
    <circle cx="536" cy="406" r="16" fill="#fff3e2"/><text x="536" y="411" font-size="12.6" text-anchor="middle">⚙️</text>
    <text x="564" y="404" font-size="12.2" font-weight="700" fill="#1f2328">Backend Dev · S3</text>
    <text x="564" y="422" font-size="9.7" fill="#778ba3">Sole authority on business logic · API impl</text>
    <rect x="564" y="434" width="84" height="20" rx="10" fill="#fff3e2"/><text x="606" y="448" font-size="8.8" fill="#b07a1a" text-anchor="middle">13-backend</text>
    <rect x="656" y="434" width="88" height="20" rx="10" fill="#fff3e2"/><text x="700" y="448" font-size="8.8" fill="#b07a1a" text-anchor="middle">14-impl-rep</text>
  </g>

  <!-- 并行标记 -->
  <line x1="480" y1="400" x2="480" y2="452" stroke="#3c8571" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="420" y="413" width="120" height="22" rx="11" fill="#eef7f3" stroke="#3c8571"/>
  <text x="480" y="428" font-size="8.8" fill="#2e7d64" text-anchor="middle">Isolated files · parallel-safe</text>

  <!-- 交接轨 2：开发 → 收口 -->
  <line x1="290" y1="472" x2="290" y2="492" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="670" y1="472" x2="670" y2="492" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="290" y1="492" x2="670" y2="492" stroke="#8fa3c0" stroke-width="1.4"/>
  <line x1="290" y1="492" x2="290" y2="508" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="670" y1="492" x2="670" y2="508" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="480" y="487" font-size="8.8" fill="#778ba3" text-anchor="middle">Deliverables → review / test</text>

  <!-- ============ 第三层：组长 × 测试 ============ -->
  <g filter="url(#sh)">
    <rect x="120" y="514" width="340" height="110" rx="12" fill="#ffffff"/>
    <rect x="120" y="514" width="6" height="110" rx="3" fill="#c0392b"/>
    <circle cx="156" cy="544" r="16" fill="#fdeceb"/><text x="156" y="549" font-size="12.6" text-anchor="middle">🛡️</text>
    <text x="184" y="542" font-size="12.2" font-weight="700" fill="#1f2328">Dev Lead · S4 integration</text>
    <text x="184" y="560" font-size="9.7" fill="#778ba3">6-point deviation check · review · green build</text>
    <text x="184" y="577" font-size="8.8" fill="#c0392b">Triage: bug→dev · spec→PM · structure→architect</text>
    <rect x="184" y="589" width="150" height="20" rx="10" fill="#fdeceb"/><text x="259" y="603" font-size="8.8" fill="#c0392b" text-anchor="middle">15-code-review · 16-build</text>

    <rect x="500" y="514" width="340" height="110" rx="12" fill="#ffffff"/>
    <rect x="500" y="514" width="6" height="110" rx="3" fill="#16a085"/>
    <circle cx="536" cy="544" r="16" fill="#e6f7f5"/><text x="536" y="549" font-size="12.6" text-anchor="middle">🔎</text>
    <text x="564" y="542" font-size="12.2" font-weight="700" fill="#1f2328">QA · S5 testing</text>
    <text x="564" y="560" font-size="9.7" fill="#778ba3">Test plan · execution · defects with root cause</text>
    <text x="564" y="577" font-size="8.8" fill="#778ba3">P0 in 3 modes: normal / boundary / error</text>
    <rect x="564" y="589" width="130" height="20" rx="10" fill="#e6f7f5"/><text x="629" y="603" font-size="8.8" fill="#0f6e63" text-anchor="middle">17-plan · 18-report</text>
  </g>

  <!-- 缺陷单：QA → 组长（定性权只在组长） -->
  <line x1="500" y1="566" x2="466" y2="566" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>

  <!-- 收口 → 门禁流 -->
  <line x1="290" y1="624" x2="290" y2="644" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="670" y1="624" x2="670" y2="644" stroke="#8fa3c0" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ 底部：门禁流 + 看板 ============ -->
  <rect x="60" y="650" width="520" height="120" rx="12" fill="#ffffff" stroke="#d0d7de" filter="url(#sh)"/>
  <text x="80" y="676" font-size="10.9" font-weight="700" fill="#1f2328">🚦 Gate flow (every stage)</text>
  <g font-size="10.1">
    <rect x="80" y="690" width="92" height="28" rx="14" fill="#e8f7f0"/><text x="126" y="709" text-anchor="middle" fill="#1a7f37">PASS → proceed</text>
    <line x1="178" y1="704" x2="206" y2="704" stroke="#8fa3c0" marker-end="url(#arr)"/>
    <rect x="212" y="690" width="170" height="28" rx="14" fill="#fff8e1"/><text x="297" y="709" text-anchor="middle" fill="#9a6700">CONCERN → log open item</text>
    <line x1="388" y1="704" x2="416" y2="704" stroke="#8fa3c0" marker-end="url(#arr)"/>
    <rect x="422" y="690" width="100" height="28" rx="14" fill="#fdeceb"/><text x="472" y="709" text-anchor="middle" fill="#cf222e">FAIL → send back</text>
  </g>
  <text x="80" y="740" font-size="9.7" fill="#57606a">S7 delivery needs 3 signatures: dev-lead ✓ QA ✓ PM ✓ — no exceptions</text>
  <text x="80" y="758" font-size="9.7" fill="#57606a">S6 acceptance: PM actually re-runs it · delivery includes a 4-question retro</text>

  <rect x="610" y="650" width="290" height="120" rx="12" fill="#ffffff" stroke="#d0d7de" filter="url(#sh)"/>
  <text x="755" y="676" font-size="10.9" font-weight="700" fill="#1f2328" text-anchor="middle">📊 Live runtime board</text>
  <g font-size="9.2" fill="#57606a">
    <text x="626" y="698">· stage map (weighted progress)</text>
    <text x="626" y="715">· agent cards: model trio · silence timer</text>
    <text x="626" y="732">· token ledger · message stream · watchdog resume</text>
    <text x="626" y="752">see docs/BOARD.md</text>
  </g>
</svg>
