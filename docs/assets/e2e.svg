    <text x="560" y="131" fill="#57606a" font-weight="700">31 / 40 · 163.5k tok</text>
  </g>

  <!-- 分项小注 -->
  <g font-size="12" fill="#57606a">
    <text x="24" y="176">分项（B1 → B2）：PRD 6→8 · 架构 7→7 · 代码 10→11 · 测试计划 8→9</text>
