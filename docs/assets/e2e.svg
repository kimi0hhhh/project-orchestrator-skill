<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1f2328">端到端小产品：两条流水线盲评对比（40 分制）</text>

  <g font-size="12">
    <text x="24" y="80" fill="#1f2328">B2 本框架（9 次派发）</text>
    <rect x="240" y="64" width="350" height="24" rx="4" fill="#2da44e"/>
    <text x="600" y="81" fill="#1a7f37" font-weight="700">35 / 40（+13%）· 357k tok · 2.2×</text>

