    <text x="24" y="216">B2 的新失败模式：契约精度向代码传导衰减（parseInt 类接缝 bug）→ 已加"契约↔代码对齐"门禁</text>
  </g>

  <rect x="24" y="228" width="672" height="2" fill="#eaeef2"/>
</svg>
