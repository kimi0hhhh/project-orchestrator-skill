<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="720" height="270" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1f2328">对照实验：同题 PRD 三条件盲评得分（30 分制，每条件 2 遍）</text>

  <!-- 满分参考线 30 -->
  <g font-size="12">
    <!-- C3 -->
    <text x="24"  y="78" fill="#1f2328">C3 本框架（参谋+返修）</text>
    <rect x="230" y="62" width="300" height="24" rx="4" fill="#2da44e"/>
    <text x="540" y="79" fill="#1a7f37" font-weight="700">22.5 均（22 / 23）· 121.9k tok</text>
    <!-- C1 -->
    <text x="24"  y="128" fill="#1f2328">C1 单角色基线</text>
    <rect x="230" y="112" width="280" height="24" rx="4" fill="#8b949e"/>
    <text x="520" y="129" fill="#57606a" font-weight="700">21.0 均（21 / 21）· 21.1k tok</text>
    <!-- C2 -->
    <text x="24"  y="178" fill="#1f2328">C2 仅点名 skill</text>
    <rect x="230" y="162" width="230" height="24" rx="4" fill="#cf222e"/>
    <text x="470" y="179" fill="#cf222e" font-weight="700">17.25 均（19 / 15.5）· 32.3k tok</text>
  </g>

  <!-- 满分线 -->
  <line x1="530" y1="52" x2="530" y2="196" stroke="#d0d7de" stroke-dasharray="4 3"/>
  <text x="530" y="48" font-size="11" fill="#8b949e" text-anchor="middle">满分 30</text>

  <rect x="24" y="212" width="672" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="229" font-size="12" fill="#57606a">要点：C3 最稳（极差 1 分），增益集中在指标口径与异常边界；C2 负收益（模板挤出实质内容）。</text>
  <text x="40" y="245" font-size="12" fill="#57606a">评审方式：产出匿名化后由独立评审 agent 按五维评分卡盲评。n=2，方向一致但不构成统计显著。</text>
</svg>
